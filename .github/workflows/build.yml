# Build checks for the octwin.ai in-app chat samples.
#
# Lives in the monorepo under packages/ and only runs once mirrored to
# github.com/Cequens/octwin-in-app-chat. (GitHub reads workflows only from the
# .github/workflows folder at a repository's root.)
#
# What each job proves, and what it does NOT:
#   server        Real tests (node --test) against the real Express app.
#   flutter       A real debug APK build, plus `flutter analyze` and the unit tests.
#                 No iOS build: that needs macOS, signing and a Firebase config.
#   react-native  Type-check and lint only. There is no android/ or ios/ project here.
#   android       ktlint (syntax and style), then a real compile of the Kotlin files inside a
#                 throwaway Gradle project. NOT an app you can run: no Firebase config, no signing.
#   ios           Swift syntax for every file, plus a type-check of the two files that need
#                 only UIKit and WebKit. NOT a build: there is no Xcode project.

name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # flutter/ holds the Dart code and pubspec.yaml, with no android/ or ios/ folder.
      # Make them in a temp copy, the same way a developer does (see flutter/README.md).
      - name: Create the platform folders
        run: |
          cp -r flutter "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          if [ ! -d android ] || [ ! -d ios ]; then
            # --project-name: the folder is called "flutter", which is not a valid package name.
            flutter create --project-name octwin_in_app_chat --org ai.octwin.sample --platforms=android,ios .
            # flutter create adds a test for its counter demo. This app has no counter.
            rm -f test/widget_test.dart
            # permission_handler 13 needs compileSdk 37 (see flutter/README.md, step 1).
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' android/app/build.gradle.kts
            grep -q 'compileSdk = 37' android/app/build.gradle.kts
          fi
      - run: flutter pub get
        working-directory: ${{ runner.temp }}/app
      - run: flutter analyze
        working-directory: ${{ runner.temp }}/app
      - run: flutter test
        working-directory: ${{ runner.temp }}/app
      # Builds without google-services.json: Firebase is only needed when the app runs.
      - run: flutter build apk --debug
        working-directory: ${{ runner.temp }}/app

  react-native:
    # A full native build needs an android/ and ios/ project, a Firebase config and a
    # long Gradle / CocoaPods run. Too heavy for a code sample: type-check and lint instead.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No lockfile on purpose: these files are copied into a new project, which picks
      # its own versions. This check uses the versions in package.json.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint --ext .ts,.tsx .

  android:
    # android/ holds source files, not a Gradle project. ktlint parses every file and checks
    # the style; then the files are compiled inside a throwaway Gradle project.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: ktlint (syntax and style)
        run: |
          curl -sSLf -o "$RUNNER_TEMP/ktlint" https://github.com/ktlint/ktlint/releases/download/1.8.0/ktlint
          chmod +x "$RUNNER_TEMP/ktlint"
          "$RUNNER_TEMP/ktlint" "android/**/*.kt" "android/**/*.kts"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1
      # The dependency lines are copied from android/app/build.gradle.kts, so the
      # versions a developer reads are the versions this compiles against.
      - name: Compile the Kotlin files in a throwaway Gradle project
        run: |
          work="$RUNNER_TEMP/native"
          mkdir -p "$work/app"
          cp -r android/app/src "$work/app/"
          cat > "$work/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          plugins { id("com.android.application") version "9.1.0" apply false }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include(":app")
          EOF
          echo "android.useAndroidX=true" > "$work/gradle.properties"
          {
            echo 'plugins { id("com.android.application") }'
            echo 'android {'
            echo '    namespace = "ai.octwin.sample"'
            echo '    compileSdk = 37'
            echo '    defaultConfig { applicationId = "ai.octwin.sample"; minSdk = 24; targetSdk = 36 }'
            echo '    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }'
            echo '}'
            echo 'dependencies {'
            grep 'implementation(' android/app/build.gradle.kts
            echo '}'
          } > "$work/app/build.gradle.kts"
          cd "$work"
          gradle --no-daemon :app:compileDebugKotlin

  ios:
    # ios/ holds source files, not an Xcode project, so nothing here can build an app.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Swift syntax (parse only)
        run: |
          for file in ios/*.swift; do
            echo "parse $file"
            swiftc -parse "$file"
          done
      # A real type-check against the iOS SDK, for the files that need only UIKit and
      # WebKit. AppDelegate+Push.swift needs Firebase and your AppDelegate, so it is
      # syntax-checked only.
      - name: Type-check ChatViewController.swift and SessionClient.swift
        run: |
          swiftc -typecheck \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -target arm64-apple-ios17.0-simulator \
            ios/ChatViewController.swift ios/SessionClient.swift
